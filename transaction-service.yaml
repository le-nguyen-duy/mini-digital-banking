openapi: 3.0.3
info:
  title: Transaction Service API
  description: >
    Xử lý lệnh chuyển tiền giữa các tài khoản và quản lý lịch sử giao dịch
    trong hệ thống Digital Banking Microservices Platform.
  version: 1.0.0
  contact:
    name: Duy Le

servers:
  - url: http://localhost:8082
    description: Local (Docker Compose)
  - url: http://transaction-service.banking-demo.svc.cluster.local
    description: Internal (Kubernetes cluster)

tags:
  - name: Transactions
    description: Khởi tạo và tra cứu giao dịch chuyển tiền

security:
  - bearerAuth: []

paths:
  /api/v1/transactions:
    post:
      tags: [Transactions]
      summary: Khởi tạo lệnh chuyển tiền
      description: >
        Gọi REST đồng bộ đến account-service để kiểm tra & trừ số dư
        (được bảo vệ bởi Resilience4j Circuit Breaker + Retry).
        Sau khi ghi nhận, publish sự kiện `transaction.created` lên Kafka.
        Rate limit áp dụng theo user để chống spam giao dịch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        '202':
          description: Giao dịch đã được tiếp nhận, đang xử lý (trạng thái PENDING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          description: Số tiền không hợp lệ (TXN_INVALID_AMOUNT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Giao dịch trùng lặp (TXN_DUPLICATE_REQUEST), phát hiện qua Idempotency-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Số dư không đủ (TXN_INSUFFICIENT_BALANCE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Vượt quá giới hạn rate limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: account-service tạm thời không khả dụng, Circuit Breaker đang OPEN (ACCOUNT_SERVICE_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
          description: Client tự sinh để chống double-submit khi retry request

  /api/v1/transactions/{transactionId}:
    get:
      tags: [Transactions]
      summary: Tra cứu chi tiết một giao dịch
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chi tiết giao dịch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Không tìm thấy giao dịch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/transactions:
    get:
      tags: [Transactions]
      summary: Tra cứu lịch sử giao dịch theo tài khoản (có phân trang)
      parameters:
        - name: accountId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, COMPLETED, FAILED]
      responses:
        '200':
          description: Danh sách giao dịch (phân trang)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /actuator/health:
    get:
      tags: [Transactions]
      summary: Health check (dùng cho Kubernetes liveness/readiness probe)
      security: []
      responses:
        '200':
          description: Service khoẻ mạnh

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token (JWT) do Keycloak phát hành.

  schemas:
    CreateTransactionRequest:
      type: object
      required: [fromAccount, toAccount, amount]
      properties:
        fromAccount:
          type: string
          format: uuid
        toAccount:
          type: string
          format: uuid
        amount:
          type: number
          format: decimal
          minimum: 0.01
        description:
          type: string
          maxLength: 255

    TransactionResponse:
      type: object
      properties:
        transactionId:
          type: string
          format: uuid
        fromAccount:
          type: string
          format: uuid
        toAccount:
          type: string
          format: uuid
        amount:
          type: number
          format: decimal
        status:
          type: string
          enum: [PENDING, COMPLETED, FAILED]
        errorCode:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TransactionPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TransactionResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
        errorCode:
          type: string
          example: TXN_INSUFFICIENT_BALANCE
        message:
          type: string
        path:
          type: string

  responses:
    Unauthorized:
      description: Token không hợp lệ hoặc hết hạn (AUTH_INVALID_TOKEN)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Không có quyền thao tác trên giao dịch/tài khoản này (AUTH_FORBIDDEN_RESOURCE)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

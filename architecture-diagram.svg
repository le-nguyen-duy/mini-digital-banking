<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a5063"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c2660b"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#14284a">Digital Banking Microservices Platform — Architecture</text>

  <!-- Client -->
  <rect x="500" y="56" width="200" height="46" rx="6" fill="#14284a"/>
  <text x="600" y="84" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">Client (Postman / UI)</text>

  <!-- Keycloak -->
  <rect x="880" y="56" width="220" height="46" rx="6" fill="#8a2be2" fill-opacity="0.85"/>
  <text x="990" y="78" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">Keycloak</text>
  <text x="990" y="94" text-anchor="middle" font-size="10" fill="#eee">OAuth2 / OIDC · Issue JWT</text>

  <line x1="700" y1="79" x2="880" y2="79" stroke="#8a2be2" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="790" y="72" text-anchor="middle" font-size="9" fill="#5b6273">1. Login</text>

  <line x1="600" y1="102" x2="600" y2="140" stroke="#4a5063" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="640" y="122" text-anchor="middle" font-size="9" fill="#5b6273">2. Bearer Token</text>

  <!-- Kubernetes cluster boundary -->
  <rect x="60" y="140" width="1080" height="560" rx="10" fill="#eef1f6" stroke="#c6cbd6" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="80" y="164" font-size="12" font-weight="bold" fill="#5b6273">Kubernetes Cluster (namespace: banking-demo)</text>

  <!-- Vault -->
  <rect x="90" y="185" width="150" height="70" rx="6" fill="#212121"/>
  <text x="165" y="212" text-anchor="middle" font-size="12" fill="#ffd54f" font-weight="bold">Vault</text>
  <text x="165" y="228" text-anchor="middle" font-size="9" fill="#ddd">DB creds, Keycloak</text>
  <text x="165" y="241" text-anchor="middle" font-size="9" fill="#ddd">client secret (dynamic)</text>

  <!-- ELK -->
  <rect x="960" y="185" width="160" height="70" rx="6" fill="#005571"/>
  <text x="1040" y="208" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">Elasticsearch</text>
  <text x="1040" y="223" text-anchor="middle" font-size="10" fill="#cfe8f2">+ Kibana</text>
  <text x="1040" y="238" text-anchor="middle" font-size="9" fill="#cfe8f2">Log tập trung / traceId</text>

  <!-- Transaction service -->
  <rect x="470" y="200" width="260" height="70" rx="6" fill="#14284a"/>
  <text x="600" y="224" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">transaction-service</text>
  <text x="600" y="240" text-anchor="middle" font-size="9" fill="#b9c6de">Resilience4j: Circuit Breaker</text>
  <text x="600" y="253" text-anchor="middle" font-size="9" fill="#b9c6de">Retry · Rate Limiter</text>

  <line x1="600" y1="140" x2="600" y2="200" stroke="#4a5063" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Account service -->
  <rect x="270" y="330" width="230" height="66" rx="6" fill="#1c3a63"/>
  <text x="385" y="356" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">account-service</text>
  <text x="385" y="372" text-anchor="middle" font-size="9" fill="#b9c6de">Số dư · Tài khoản</text>

  <!-- Notification service -->
  <rect x="700" y="330" width="230" height="66" rx="6" fill="#1c3a63"/>
  <text x="815" y="356" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">notification-service</text>
  <text x="815" y="372" text-anchor="middle" font-size="9" fill="#b9c6de">Consume event → giả lập gửi noti</text>

  <!-- REST call transaction -> account -->
  <line x1="470" y1="245" x2="440" y2="330" stroke="#4a5063" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="380" y="300" text-anchor="middle" font-size="9" fill="#5b6273">REST (check &amp; update balance)</text>

  <!-- Kafka -->
  <rect x="470" y="460" width="260" height="80" rx="6" fill="#c2660b"/>
  <text x="600" y="486" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">Kafka</text>
  <text x="600" y="502" text-anchor="middle" font-size="9" fill="#ffe9d6">transaction.created / completed / failed</text>
  <text x="600" y="516" text-anchor="middle" font-size="9" fill="#ffe9d6">account.balance.updated</text>

  <line x1="500" y1="396" x2="540" y2="460" stroke="#c2660b" stroke-width="1.6" marker-end="url(#arrowOrange)"/>
  <line x1="600" y1="270" x2="600" y2="460" stroke="#c2660b" stroke-width="1.6" marker-end="url(#arrowOrange)"/>
  <line x1="700" y1="396" x2="660" y2="460" stroke="#c2660b" stroke-width="1.6" marker-end="url(#arrowOrange)"/>
  <line x1="815" y1="460" x2="815" y2="396" stroke="#c2660b" stroke-width="1.6" marker-end="url(#arrowOrange)"/>

  <!-- Databases -->
  <rect x="270" y="590" width="140" height="56" rx="6" fill="#336791"/>
  <text x="340" y="614" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">account_db</text>
  <text x="340" y="630" text-anchor="middle" font-size="9" fill="#dbe8f4">PostgreSQL / Oracle</text>
  <line x1="385" y1="396" x2="340" y2="590" stroke="#4a5063" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="530" y="590" width="140" height="56" rx="6" fill="#336791"/>
  <text x="600" y="614" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">transaction_db</text>
  <text x="600" y="630" text-anchor="middle" font-size="9" fill="#dbe8f4">PostgreSQL / Oracle</text>
  <line x1="600" y1="270" x2="600" y2="590" stroke="#4a5063" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

  <rect x="790" y="590" width="140" height="56" rx="6" fill="#336791"/>
  <text x="860" y="614" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">notification_db</text>
  <text x="860" y="630" text-anchor="middle" font-size="9" fill="#dbe8f4">PostgreSQL / Oracle</text>
  <line x1="815" y1="396" x2="860" y2="590" stroke="#4a5063" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Vault dashed connections -->
  <line x1="165" y1="255" x2="270" y2="345" stroke="#9c9c9c" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="165" y1="255" x2="470" y2="230" stroke="#9c9c9c" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="165" y1="255" x2="700" y2="345" stroke="#9c9c9c" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="165" y="270" text-anchor="middle" font-size="8" fill="#8a8a8a">secrets injection</text>

  <!-- ELK dashed connections -->
  <line x1="1040" y1="255" x2="730" y2="235" stroke="#7fb3c4" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="1040" y1="255" x2="500" y2="345" stroke="#7fb3c4" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="1040" y1="255" x2="815" y2="330" stroke="#7fb3c4" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="1040" y="270" text-anchor="middle" font-size="8" fill="#5599aa">log shipping (traceId)</text>

  <!-- Legend -->
  <g transform="translate(90,700)">
    <rect x="0" y="0" width="16" height="10" fill="#4a5063"/>
    <text x="22" y="9" font-size="9" fill="#33394a">REST đồng bộ</text>
    <rect x="120" y="0" width="16" height="10" fill="#c2660b"/>
    <text x="142" y="9" font-size="9" fill="#33394a">Kafka bất đồng bộ</text>
    <rect x="270" y="0" width="16" height="10" fill="#9c9c9c"/>
    <text x="292" y="9" font-size="9" fill="#33394a">Vault secrets</text>
    <rect x="400" y="0" width="16" height="10" fill="#7fb3c4"/>
    <text x="422" y="9" font-size="9" fill="#33394a">Log → ELK</text>
  </g>
</svg>
